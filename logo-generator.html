<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Logo 文字生成器</title>
<style>
:root {
  --bg-primary: #000000;
  --bg-surface: rgba(255,255,255,0.04);
  --bg-surface-hover: rgba(255,255,255,0.06);
  --bg-input: rgba(255,255,255,0.06);
  --bg-input-focus: rgba(255,255,255,0.08);
  --accent: #0071E3;
  --accent-hover: #0077ED;
  --accent-subtle: rgba(0,113,227,0.12);
  --text-primary: rgba(255,255,255,0.92);
  --text-secondary: rgba(255,255,255,0.55);
  --text-tertiary: rgba(255,255,255,0.32);
  --border-subtle: rgba(255,255,255,0.06);
  --border-default: rgba(255,255,255,0.1);
  --border-focus: rgba(0,113,227,0.4);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  --transition: 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg-primary);min-height:100vh;color:var(--text-primary);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding:24px 16px}
.container{max-width:900px;margin:0 auto}
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.section-title{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:16px}
.form-group{margin-bottom:16px}
.form-group:last-child{margin-bottom:0}
label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:8px;letter-spacing:0.2px}
input[type="text"],textarea{width:100%;padding:12px 14px;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:14px;font-family:var(--font-sans);outline:none;transition:background-color var(--transition),border-color var(--transition),color var(--transition),opacity var(--transition),transform var(--transition)}
input[type="text"]:focus,textarea:focus{border-color:var(--border-focus);background:var(--bg-input-focus);box-shadow:0 0 0 3px var(--accent-subtle)}
textarea{resize:vertical;line-height:1.5;min-height:50px}
input[type="color"]{width:100%;height:40px;padding:4px;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-md);cursor:pointer}
.btn{width:100%;padding:14px;border:none;border-radius:var(--radius-xl);font-size:15px;font-weight:500;font-family:var(--font-sans);cursor:pointer;transition:background-color var(--transition),border-color var(--transition),color var(--transition),opacity var(--transition),transform var(--transition);letter-spacing:0.2px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{transform:scale(0.98);opacity:0.9}
.btn-secondary{background:transparent;border:1px solid var(--border-default);color:var(--text-secondary);margin-top:8px}
.btn-secondary:hover{background:var(--bg-surface-hover);color:var(--text-primary)}

.size-toggle{display:flex;gap:8px;margin-top:8px}
.size-btn{flex:1;padding:10px;border:1px solid var(--border-default);background:transparent;border-radius:var(--radius-md);color:var(--text-secondary);font-size:14px;cursor:pointer;transition:background-color var(--transition),border-color var(--transition),color var(--transition),opacity var(--transition),transform var(--transition)}
.size-btn:hover{background:var(--bg-surface-hover)}
.size-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}

.preview-area{background:var(--bg-input);border-radius:var(--radius-lg);padding:32px;display:flex;align-items:center;justify-content:center;min-height:180px;overflow-x:auto}
.preview-inner{position:relative;display:inline-block}
.preview-inner canvas{display:block;max-width:100%;height:auto}
.export-outline{position:absolute;inset:0;border:2px dashed rgba(255,255,255,0.2);border-radius:2px;pointer-events:none}
.export-size{position:absolute;bottom:-22px;right:0;font-size:10px;color:var(--text-tertiary);font-family:var(--font-mono, monospace);white-space:nowrap}
.ph{color:var(--text-tertiary);font-size:13px;text-align:center}

@font-face{font-family:'AlimamaLogo';src:url('./AlimamaShuHeiTi.ttf') format('truetype');font-weight:400;font-style:normal}
h1{text-align:center;margin-bottom:24px;font-size:24px;font-weight:600;color:var(--text-primary);letter-spacing:-0.3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-input);border-radius:var(--radius-md);font-size:12px;color:var(--text-secondary)}
.info-row .val{color:var(--accent);font-weight:500}
</style>
<link rel="preload" href="./AlimamaShuHeiTi.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<div class="container">
  <h1>Logo 文字生成器</h1>

  <div class="card">
    <div class="section-title">实时预览</div>
    <div class="preview-area" id="previewArea">
      <div class="ph" id="ph">请输入文字内容</div>
      <div class="preview-inner" id="previewInner" style="display:none">
        <canvas id="previewCanvas"></canvas>
        <div class="export-outline" id="exportOutline"></div>
        <div class="export-size" id="exportSize"></div>
      </div>
    </div>
    <div class="info-row" style="margin-top:12px">
      <span>导出尺寸：</span>
      <span class="val" id="sizeInfo">—</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text-tertiary)">左对齐 · 70px 高</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">文字内容</div>
    <div class="form-group">
      <textarea id="textInput" rows="2" placeholder="输入要生成的文字...">Logo 文字</textarea>
    </div>
  </div>

  <div class="card">
    <div class="section-title">字体样式</div>
    <div class="form-group">
      <label>字体</label>
      <div style="padding:12px 14px;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:14px">Alimama ShuHeiTi · Regular</div>
    </div>
    <div class="form-group">
      <label>字号</label>
      <div class="size-toggle">
        <button class="size-btn" data-size="50">50px</button>
        <button class="size-btn active" data-size="60">60px</button>
      </div>
    </div>
    <div class="form-group">
      <label>文字颜色</label>
      <input type="color" id="textColor" value="#ffffff">
    </div>
    <div class="form-group">
      <label>预览背景色</label>
      <input type="color" id="previewBg" value="#19191b">
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="exportFmt">导出格式</label>
      <select id="exportFmt" style="width:100%">
        <option value="png" selected>PNG · 无损（透明背景）</option>
        <option value="webp">WebP · 高压缩（透明背景）</option>
      </select>
    </div>
    <button class="btn btn-primary" id="downloadBtn">下载图片</button>
    <button class="btn btn-secondary" id="resetBtn">重置默认</button>
  </div>
</div>

<script>
const canvas=document.getElementById('previewCanvas'),ctx=canvas.getContext('2d');
const ph=document.getElementById('ph');
const previewInner=document.getElementById('previewInner');
const textInput=document.getElementById('textInput');
const textColor=document.getElementById('textColor');
const previewBg=document.getElementById('previewBg');
const sizeInfo=document.getElementById('sizeInfo');
const exportSize=document.getElementById('exportSize');
const H=70;
let fontSize=60;

document.querySelectorAll('.size-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.size-btn').forEach(function(b){b.classList.remove('active')});
    this.classList.add('active');
    fontSize=parseInt(this.dataset.size);
    render();
  });
});

function render(){
  var text=textInput.value.trim();
  if(!text){ph.style.display='';previewInner.style.display='none';return}
  ph.style.display='none';previewInner.style.display='inline-block';

  var ls=2;
  ctx.font='normal '+fontSize+'px "AlimamaLogo","Alimama ShuHeiTi",sans-serif';

  var chars=text.split('');
  var tw=0;
  chars.forEach(function(c,i){
    if(i>0)tw+=ls;
    tw+=ctx.measureText(c).width;
  });

  var twInt=Math.max(1,Math.ceil(tw));
  canvas.width=twInt;canvas.height=H;

  // 透明背景
  ctx.clearRect(0,0,twInt,H);

  // 文字
  ctx.font='normal '+fontSize+'px "AlimamaLogo","Alimama ShuHeiTi",sans-serif';
  ctx.fillStyle=textColor.value;
  ctx.textAlign='left';
  ctx.textBaseline='middle';

  var cx=0;
  chars.forEach(function(c){
    ctx.fillText(c,cx,H/2);
    cx+=ctx.measureText(c).width+ls;
  });

  // 更新尺寸信息
  sizeInfo.textContent=twInt+' × '+H+' px';
  exportSize.textContent=twInt+'×'+H+'px · PNG 透明';
}

// 预览背景色变化时更新预览区
previewBg.addEventListener('input',function(){
  document.getElementById('previewArea').style.background=this.value;
});

textInput.addEventListener('input',render);
textColor.addEventListener('input',render);

	document.getElementById('downloadBtn').addEventListener('click',function(){
	  var fmt=document.getElementById('exportFmt').value;
	  var mime=fmt==='webp'?'image/webp':'image/png';
	  canvas.toBlob(function(blob){
	    if(!blob) return;
	    var ext=blob.type==='image/webp'?'webp':'png';
	    var a=document.createElement('a');
	    a.download='logo_'+Date.now()+'.'+ext;
	    a.href=URL.createObjectURL(blob);
	    a.click();
	    setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
	  },mime,fmt==='webp'?0.92:1);
	});

	document.getElementById('resetBtn').addEventListener('click',function(){
  textInput.value='Logo 文字';
  fontSize=60;
  document.querySelectorAll('.size-btn').forEach(function(b){b.classList.remove('active')});
  document.querySelector('.size-btn[data-size="60"]').classList.add('active');
  textColor.value='#ffffff';
  previewBg.value='#19191b';
  document.getElementById('previewArea').style.background='#19191b';
  render();
});

// 初始预览背景
document.getElementById('previewArea').style.background=previewBg.value;

	// 立即先画一版（字体未到时是系统字体），字体加载完成后再重绘。
	// 必须显式 fonts.load：canvas 使用不会触发 @font-face 下载，
	// 只等 document.fonts.ready 可能永远不会加载字体。
	function _renderAll(){ try { render(); } catch (e) {} }
	requestAnimationFrame(_renderAll);
	if (document.fonts && document.fonts.load) {
	  document.fonts.load('60px "AlimamaLogo"').then(_renderAll).catch(function(){});
	  document.fonts.load('20px "AlimamaLogo"').then(_renderAll).catch(function(){});
	  document.fonts.ready.then(_renderAll);
	  if (document.fonts.addEventListener) {
	    document.fonts.addEventListener('loadingdone', _renderAll);
	  }
	}
	// 兜底：弱网下字体可能晚到，完成后仍会由 loadingdone 重绘
	setTimeout(_renderAll, 1500);
</script>
<script src="./a11y.js" defer></script>
</body>
</html>
