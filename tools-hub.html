<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>酒店工具集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;background:#000;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);z-index:100}
.header h1{font-size:15px;font-weight:600;color:rgba(255,255,255,0.92);margin:0;letter-spacing:-0.2px}
.tabs{display:flex;gap:2px;background:rgba(255,255,255,0.06);border-radius:10px;padding:3px}
.tab{padding:7px 18px;border:none;background:transparent;color:rgba(255,255,255,0.45);font-size:13px;border-radius:8px;cursor:pointer;transition:all 0.2s ease;white-space:nowrap;font-family:inherit}
.tab:hover{color:rgba(255,255,255,0.75)}
.tab.active{background:#0071E3;color:#fff;font-weight:500}
.content{position:fixed;top:53px;left:0;right:0;bottom:0}
.content iframe{width:100%;height:100%;border:none;display:none}
.content iframe.active{display:block}
</style>
</head>
<body>
<div class="header">
  <h1>🏨 酒店工具集</h1>
  <div class="tabs">
    <button class="tab active" data-id="welcome">📝 欢迎文本</button>
    <button class="tab" data-id="qr">📱 二维码叠加</button>
    <button class="tab" data-id="card">🔤 卡片文本</button>
    <button class="tab" data-id="logo">✨ 生成logo</button>
    <button class="tab" data-id="convert">📺 开机logo制作</button>
    <button class="tab" data-id="video">🎬 开机视频</button>
  </div>
</div>
<div class="content">
  <iframe class="active" id="fw" src="./hotel-welcome-generator.html"></iframe>
  <iframe id="fq" src="./qr-overlay-generator.html"></iframe>
  <iframe id="fc" src="./card-text-overlay.html"></iframe>
  <iframe id="fl" src="./logo-generator.html"></iframe>
  <iframe id="fcv" src="./image-converter.html"></iframe>
  <iframe id="fvid" src="./video-converter.html"></iframe>
</div>
<script>
// 非本地环境隐藏"开机视频"Tab（视频转换依赖本地 server.js）
var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '0.0.0.0';
if (!isLocal) {
  var videoTab = document.querySelector('.tab[data-id="video"]');
  var videoIframe = document.getElementById('fvid');
  if (videoTab) videoTab.style.display = 'none';
  if (videoIframe) videoIframe.remove();
}

document.querySelectorAll('.tab').forEach(function(t) {
  t.onclick = function() {
    var map = {welcome:'fw', qr:'fq', card:'fc', logo:'fl', convert:'fcv', video:'fvid'};
    document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    document.querySelectorAll('.content iframe').forEach(function(f) { f.classList.remove('active'); });
    document.getElementById(map[this.dataset.id]).classList.add('active');
  };
});
</script>
</body>
</html>
